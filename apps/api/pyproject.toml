[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telltale-api"
version = "0.1.0"
description = "Telltale REST API: fleet health, sensor risk, machine-sound analysis."
requires-python = ">=3.10"
dependencies = [
  "telltale-ml",                 # local package in ../../ml (install both in one pip command)
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
include = ["telltale_api*"]

[tool.setuptools.package-data]
telltale_api = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
