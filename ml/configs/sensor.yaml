# Sensor failure-risk model (AI4I 2020). Used by `telltale-train-sensor`.
seed: 42

data:
  # null -> data/raw/ai4i2020/ai4i2020.csv
  path: null
  val_fraction: 0.15
  test_fraction: 0.15

# LightGBM params shared by the overall-failure model and the per-failure-mode models.
lightgbm:
  n_estimators: 600
  learning_rate: 0.03
  num_leaves: 15
  min_child_samples: 10
  subsample: 0.9
  subsample_freq: 1
  colsample_bytree: 0.9
  reg_lambda: 1.0
  verbose: -1

early_stopping_rounds: 60

# A failure-mode model may only raise a flag if its VALIDATION F1 reaches this value.
# Weaker mode models are still shown, but marked low-confidence and never flagged.
min_mode_val_f1: 0.5

risk:
  # "high"   = the validation-tuned (max-F1) decision threshold of the failure model.
  # "medium" = medium_fraction * high  -> an early-warning band below the alert threshold.
  medium_fraction: 0.4

# Where artifacts go (relative to TELLTALE_MODELS_DIR).
output_subdir: sensor
